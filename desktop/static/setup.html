<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Connect to server</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; background: #f5f7fa; color: #1b2733; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 24px; width: min(440px, 92vw); }
    input { width: 100%; padding: 8px; font: inherit; border: 1px solid #b9c3cd; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 16px; font: inherit; background: #1f3a5f; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .err { color: #b42318; min-height: 1.2em; } small { color: #5d6b79; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <h1 style="font-size:1.3rem;margin-top:0">Connect to your company server</h1>
    <label for="u">Server URL</label>
    <input id="u" placeholder="https://mdm.yourcompany.com" autocomplete="url" required />
    <small>Use the address provided by your administrator. HTTPS is required.</small>
    <p class="err" id="e" role="alert"></p>
    <button type="submit">Connect</button>
  </form>
  <script src="setup.js"></script>
</body>
</html>
