# /etc/nginx/sites-available/rovexy  →  ln -s ../sites-available/rovexy /etc/nginx/sites-enabled/
# Serves rovexy.app (website, Super Admin, Accounts, licence + update API) and every workspace *.rovexy.app/admin.
# TLS: Cloudflare Origin Certificate for rovexy.app + *.rovexy.app (Cloudflare SSL mode "Full (strict)").

server {
    listen 80;
    server_name rovexy.app *.rovexy.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rovexy.app *.rovexy.app;

    ssl_certificate     /etc/ssl/rovexy/origin.pem;
    ssl_certificate_key /etc/ssl/rovexy/origin.key;

    root /var/www/rovexy/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100m;          # call recordings (≤50 MB) and update packages (Cloudflare free plan caps at 100 MB)

    # real visitor IP behind Cloudflare (rate limits, audit logs) — keep this list current: https://www.cloudflare.com/ips/
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22; set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18; set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20; set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;  set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;   set_real_ip_from 131.0.72.0/22;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # realtime (Reverb) on the same host: wss://rovexy.app/app/…
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location ~ /\.(?!well-known) { deny all; }
}
