# Versions were chosen WITHOUT network access to Google Maven / Maven Central (blocked in the build environment).
# Before the first build: update each to the current stable release and run ./gradlew :app:dependencies.
[versions]
agp = "8.11.1"
kotlin = "2.2.0"
composeBom = "2025.07.00"
activityCompose = "1.10.1"
lifecycle = "2.9.2"
navigation = "2.9.2"
okhttp = "4.12.0"
serialization = "1.9.0"
work = "2.10.2"
playLocation = "21.3.0"
firebaseBom = "34.0.0"
googleServices = "4.4.3"
webrtc = "137.7151.04"   # io.github.webrtc-sdk:android — third-party libwebrtc build; pin after the device spike
junit = "4.13.2"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
play-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playLocation" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
webrtc = { group = "io.github.webrtc-sdk", name = "android", version.ref = "webrtc" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
